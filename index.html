<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Patinando no Amor</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial, Helvetica, sans-serif;
}

body{

background:linear-gradient(135deg,#ff8ec7,#8ec5ff);
min-height:100vh;

display:flex;
justify-content:center;
align-items:center;

padding:30px;

}

.container{

width:100%;
max-width:750px;

background:rgba(255,255,255,.95);

backdrop-filter:blur(15px);

padding:35px;

border-radius:25px;

box-shadow:0 15px 40px rgba(0,0,0,.25);

}

h1{

text-align:center;

font-size:38px;

color:#ff3d94;

margin-bottom:10px;

}

h2{

text-align:center;

color:#3d7dff;

margin-bottom:25px;

font-weight:normal;

}

.estrelas-topo{

text-align:center;

font-size:35px;

margin-bottom:25px;

}

fieldset{

border:3px solid #ff9cc9;

border-radius:15px;

padding:20px;

margin-bottom:25px;

}

legend{

padding:5px 15px;

font-weight:bold;

color:#d42290;

font-size:18px;

}

label{

display:block;

margin-top:15px;

font-weight:bold;

color:rgb(7, 7, 7);

}

input[type=text],
input[type=email],
select,
textarea,
input[type=date]{

width:100%;

padding:12px;

margin-top:6px;

border-radius:10px;

border:2px solid #ce8a9f;

font-size:16px;

transition:.3s;

}

input:focus,
textarea:focus,
select:focus{

outline:none;

border-color:#6ba8ff;

box-shadow:0 0 10px #8ec5ff;

}

textarea{

resize:vertical;

}

.grupo{

margin-top:12px;

}

.grupo label{

font-weight:normal;

margin:8px 0;

display:block;

cursor:pointer;

}

.estrelas{

display:flex;

flex-direction:row-reverse;

justify-content:center;

margin-top:20px;

}

.estrelas input{

display:none;

}

.estrelas label{

font-size:40px;

color:#ccc;

cursor:pointer;

transition:.3s;

}

.estrelas input:checked ~ label,

.estrelas label:hover,

.estrelas label:hover ~ label{

color:#FFD700;

}

button{

width:100%;

padding:18px;

font-size:20px;

font-weight:bold;

border:none;

border-radius:15px;

background:linear-gradient(90deg,#3d7dff,#3d7dff);

color:white;

cursor:pointer;

transition:.4s;

}

button:hover{

transform:scale(1.03);

box-shadow:0 10px 25px rgb(0, 0, 0);

}

@media(max-width:700px){

.container{

padding:20px;

}

h1{

font-size:28px;

}

.estrelas label{

font-size:30px;

}

}

</style>

</head>

<body>

<div class="container">

<h1> PATINANDO NO AMOR </h1>

<h2>LYNN PAINTER</h2>

<form action="https://webhook.site/751621ec-b15e-44b1-8057-3405a89f082b" method="post">

<fieldset>

<legend> Informações</legend>

type="text"

type="email"

required>

<label for="4">★</label>

<label for="3">★</label>

<input type="radio" id="2" name="nota" value="2">

<label for="2">★</label>

<input type="radio" id="1" name="nota" value="1" required>

</div>

<option>Alec</option>

<option>Mick</option>

<option>benji</option>

<option>Cassie</option>

<option>Kyle</option>

<option>Big john</option>

<option>Outro</option>

</select>

<label>O que você mais gostou?</label>

<div class="grupo">

<label><input type="checkbox" name="gostou" value="Romance"> Romance</label>

<label><input type="checkbox" name="gostou" value="Patinação"> Patinação</label>

<label><input type="checkbox" name="gostou" value="Humor"> Humor</label>

</div>

</fieldset>

<fieldset>

<legend> Sua Opinião</legend>

<label>Qual foi a melhor frase do livro?</label>

<textarea

name="frase"

rows="4"

maxlength="300"

placeholder="Digite aqui sua frase favorita...">

</textarea>

<label>Escreva sua avaliação</label>

<textarea

name="avaliacao"

rows="6"

required

maxlength="700"

placeholder="Conte o que achou da história...">

</textarea>

<label> Quando terminou a leitura?</label>

<input

type="date"

name="data">

<label>Você recomendaria?</label>

<div class="grupo">

<label><input type="radio" name="recomendaria" value="Sim apenas" required> Sim apenas</label>

<label><input type="radio" name="recomendaria" value="definitivamente não"> Definitivamnete não</label>

<label><input type="radio" name="recomendaria" value="Talvez"> Talvez</label>

</div>

</fieldset>

<button type="submit">

 Enviar Avaliação 

</button>

</form>

</div>

</body>
</html>
